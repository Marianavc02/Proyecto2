name: CI Pipeline

on:
  pull_request:
    branches: [ "main" ]

jobs:
  # formateo automático 
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install black isort flake8
      - name: Format code (black)
        run: black .
      - name: Sort imports (isort)
        run: isort .
      - name: Lint code (flake8)
        run: flake8 .

  # seguridad de código y dependencias
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      # ✅ versiones compatibles (sin login, sin error)
      - run: pip install "click==8.1.3" "typer==0.9.0" "safety==3.2.3" bandit

      - name: Security analysis (Bandit)
        run: bandit -r . -x "env,**/migrations/**,**/tests/**"

      - name: Dependency security check (Safety)
        run: safety scan -r requirements.txt --disable-telemetry
