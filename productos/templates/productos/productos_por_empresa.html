{% extends 'base.html' %}

{% block content %}
<h1 style="text-align:center; margin: 20px 0;">Productos</h1>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; max-width: 1000px; margin: auto;">
    {% for producto in productos %}
        <a href= "{% url 'detalle_producto' producto.id %}"  style="text-decoration: none; color: black;">
            <div style="border: 1px solid #ddd; border-radius: 10px; overflow: hidden; text-align: center; box-shadow: 0px 2px 5px rgba(0,0,0,0.1);">
                {% if producto.imagenes.first %}
                    <img src="{{ producto.imagenes.first.imagen.url }}" alt="{{ producto.descripcion }}" style="width: 100%; height: 150px; object-fit: contain;">
                {% else %}
                    <div style="width: 100%; height: 150px; background: #f5f5f5; display: flex; align-items: center; justify-content: center;">Sin Imagen</div>
                {% endif %}
                <div style="background: #f4b400; padding: 10px; font-weight: bold;">{{ producto.descripcion }}</div>
                <p style="margin: 5px 0;">Precio: ${{ producto.precio_sin_iva }}</p>
            </div>
        </a>
    {% endfor %}
</div>
{% endblock %}
