{% extends "administrador/base_admin.html" %}

{% block title %}CargarExcel{% endblock %}

{% block admin_content %}
<style>
  .page-wrap {
    min-height: calc(100vh - 120px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
    background: #f5f5f5;
    font-family: 'Montserrat', sans-serif;
  }

  .form-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 30px;
  }

  .card-container {
    display: flex;
    gap: 40px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .upload-card {
    width: 320px;
    height: 320px;
    border: none;
    border-radius: 14px;
    background: #FFD20A;
    color: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 20px;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 10px 28px rgba(0, 0, 0, .15);
    transition: transform .2s ease, box-shadow .2s ease;
    padding: 20px;
    position: relative;
  }

  .upload-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 16px 36px rgba(0, 0, 0, .22);
  }

  .upload-card i {
    font-size: 56px;
    margin-bottom: 12px;
  }

  .upload-card small {
    font-size: 14px;
    font-weight: 500;
    color: #333;
    margin-top: 8px;
    line-height: 1.4;
  }

  input[type="file"] {
    display: none;
  }

  .progress-bar {
    width: 80%;
    height: 10px;
    background-color: rgba(0, 0, 0, 0.1);
    border-radius: 10px;
    overflow: hidden;
    margin-top: 15px;
    display: none;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background-color: #000;
    border-radius: 10px;
    transition: width 0.3s ease;
  }

  .messages {
    position: sticky;
    top: 90px;
    margin: 0 auto 12px;
    max-width: 360px;
    z-index: 5;
  }

  /* 🔘 Contenedor botones centrados */
  .btn-group-center {
    display: flex;
    gap: 16px;
    justify-content: center;
    align-items: center;
    margin-top: 20px;
  }

  /* 🔆 Botón amarillo (Cargar Datos) */
  .btn-yellow {
    background: #FFD20A;
    color: #000;
    border: none;
    padding: 12px 28px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.2s ease;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .btn-yellow:hover {
    background: #e6be00;
  }

  /* ⚫ Botón negro (Lista de productos) */
  .btn-black {
    background: #000;
    color: #fff;
    border: none;
    padding: 12px 28px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.2s ease;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .btn-black:hover {
    background: #333;
  }

  /* 🌀 Overlay de carga */
  .loading-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(255, 255, 255, 0.85);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    font-family: 'Montserrat', sans-serif;
  }

  .spinner {
    border: 6px solid #ddd;
    border-top: 6px solid #000;
    border-radius: 50%;
    width: 60px;
    height: 60px;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .loading-overlay p {
    margin-top: 16px;
    font-weight: 600;
    color: #000;
    font-size: 18px;
  }
</style>

<div class="messages">
  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endif %}
</div>

<div class="page-wrap">
  <div class="form-content">
    <form id="uploadForm" method="post" enctype="multipart/form-data" action="{% url 'cargar_excel' %}">
      {% csrf_token %}
      <div class="card-container">
        <label for="archivo1" class="upload-card" id="card1">
          <i class="fas fa-file-excel"></i>
          <span>Subir Archivo 1<br>(Productos)</span>
          <small>Aquí carga el archivo donde están los datos básicos del producto.</small>
          <div class="progress-bar" id="progress1"><div class="progress-fill" id="fill1"></div></div>
        </label>
        <input type="file" name="archivo1" id="archivo1" accept=".xlsx,.xls">

        <label for="archivo2" class="upload-card" id="card2">
          <i class="fas fa-boxes"></i>
          <span>Subir Archivo 2<br>(Empaque)</span>
          <small>Aquí carga el archivo donde están las cantidades de pedido mínimo del producto.</small>
          <div class="progress-bar" id="progress2"><div class="progress-fill" id="fill2"></div></div>
        </label>
        <input type="file" name="archivo2" id="archivo2" accept=".xlsx,.xls">
      </div>

      <!-- 🔘 Ambos botones centrados -->
      <div class="btn-group-center">
        <button type="submit" class="btn-yellow">
          <i class="fas fa-upload"></i> Cargar Datos
        </button>
        <a href="{% url 'lista_productos' %}" class="btn-black">
          <i class="fas fa-list"></i> Lista de productos
        </a>
      </div>
    </form>
  </div>
</div>

<!-- 🌀 Overlay de carga -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <p>Cargando datos, por favor espera...</p>
</div>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  function simulateProgress(barId, fillId) {
    const progressBar = document.getElementById(barId);
    const fill = document.getElementById(fillId);
    progressBar.style.display = "block";
    let width = 0;
    const interval = setInterval(() => {
      width += 10;
      fill.style.width = width + "%";
      if (width >= 100) clearInterval(interval);
    }, 100);
  }

  document.getElementById("archivo1").addEventListener("change", () => simulateProgress("progress1", "fill1"));
  document.getElementById("archivo2").addEventListener("change", () => simulateProgress("progress2", "fill2"));

  document.getElementById("uploadForm").addEventListener("submit", function() {
    document.getElementById("loadingOverlay").style.display = "flex";
  });
</script>
{% endblock %}
