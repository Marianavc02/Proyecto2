{% extends "administrador/base_admin.html" %}

{% block title %}CargarExcel{% endblock %}

{% block admin_content %}
<style>
  /* Contenedor centrado bajo la navbar */
  .page-wrap{
    min-height: calc(100vh - 120px);   /* deja espacio para la navbar sticky */
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
    background: #f5f5f5;
    font-family: 'Montserrat', sans-serif;
  }

  /* Tarjeta/botón de carga */
  .upload-card{
    width: 340px;
    height: 340px;
    border: none;
    border-radius: 14px;
    background: #FFD20A;
    color: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 20px;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 10px 28px rgba(0,0,0,.15);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .upload-card:hover{ transform: translateY(-2px); box-shadow: 0 16px 36px rgba(0,0,0,.22); }
  .upload-card i{ font-size: 56px; margin-bottom: 12px; }

  /* Ocultar input file real */
  input[type="file"]{ display:none; }

  /* Mensajes debajo de la navbar */
  .messages{
    position: sticky;    /* se mantiene bajo la navbar si se hace scroll */
    top: 90px;
    margin: 0 auto 12px;
    max-width: 360px;
    z-index: 5;
  }
</style>

<!-- Mensajes flash -->
<div class="messages">
  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endif %}
</div>

<!-- Tarjeta centrada -->
<div class="page-wrap">
  <form method="post" enctype="multipart/form-data" action="{% url 'cargar_excel' %}">
    {% csrf_token %}
    <label for="archivo" class="upload-card">
      <i class="fas fa-upload"></i>
      <span>Subir Productos<br>desde Excel</span>
    </label>
    <input type="file" name="archivo" id="archivo" accept=".xlsx,.xls" onchange="this.form.submit()">
  </form>
</div>

<!-- Iconos / JS (opcional) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
