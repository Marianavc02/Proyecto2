{% extends "administrador/base_admin.html" %}

{% block title %}CargarExcel{% endblock %}

{% block admin_content %}
<style>
  .page-wrap{
    min-height: calc(100vh - 120px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
    background: #f5f5f5;
    font-family: 'Montserrat', sans-serif;
    gap: 30px;
    flex-wrap: wrap;
  }

  .upload-card{
    width: 320px;
    height: 320px;
    border: none;
    border-radius: 14px;
    background: #FFD20A;
    color: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 20px;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 10px 28px rgba(0,0,0,.15);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .upload-card:hover{ transform: translateY(-2px); box-shadow: 0 16px 36px rgba(0,0,0,.22); }
  .upload-card i{ font-size: 56px; margin-bottom: 12px; }

  input[type="file"]{ display:none; }

  .messages{
    position: sticky;
    top: 90px;
    margin: 0 auto 12px;
    max-width: 360px;
    z-index: 5;
  }

  .submit-btn{
    margin-top: 20px;
    padding: 12px 30px;
    border-radius: 10px;
    border: none;
    background: #000;
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    transition: background .2s ease;
  }
  .submit-btn:hover{ background: #333; }
</style>

<div class="messages">
  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endif %}
</div>

<div class="page-wrap">
  <form method="post" enctype="multipart/form-data" action="{% url 'cargar_excel' %}">
    {% csrf_token %}

    <!-- Excel 1 -->
    <label for="archivo1" class="upload-card">
      <i class="fas fa-file-excel"></i>
      <span>Subir Archivo 1<br>(Productos)</span>
    </label>
    <input type="file" name="archivo1" id="archivo1" accept=".xlsx,.xls">

    <!-- Excel 2 -->
    <label for="archivo2" class="upload-card">
      <i class="fas fa-boxes"></i>
      <span>Subir Archivo 2<br>(Empaque)</span>
    </label>
    <input type="file" name="archivo2" id="archivo2" accept=".xlsx,.xls">

    <div style="width: 100%; text-align: center;">
      <button type="submit" class="submit-btn">Cargar Datos</button>
    </div>
  </form>
</div>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
