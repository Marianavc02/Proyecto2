{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mi App{% endblock %}</title>

    <!-- Fuente Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">
            <a href="/">
                <img src="{% static 'img/logo.png' %}" alt="StanleyBlack&Decker">
            </a>
        </div>
        <ul class="nav-links">
            <li><a href="{% url 'productos_por_empresa' 'DeWalt' %}">DeWalt</a></li>
            <li><a href="{% url 'productos_por_empresa' 'Stanley' %}">Stanley</a></li>
            <li><a href="{% url 'productos_por_empresa' 'Irwin' %}">Irwin</a></li>
            <li><a href="{% url 'productos_por_empresa' 'Black&Decker' %}">Black&Decker</a></li>
            <li><a href="{% url 'productos_por_empresa' 'Otros' %}">Otros</a></li>
        </ul>

        <div class="icons">
            <div class="nav-search" id="navSearch">
                <button type="button" class="search-toggle icon-btn" id="searchToggle" aria-label="Mostrar búsqueda">
                    <span class="material-icons">search</span>
                </button>
                <form action="{% url 'buscar_productos' %}" method="get" class="search-container">
                    <input type="text" name="q" placeholder="Buscar productos..." value="{{ request.GET.q }}">
                    <button type="submit" title="Buscar" class="icon-btn">
                        <i class="material-icons">search</i>
                    </button>
                </form>
            </div>
            <a href="#" class="icon-btn" title="Usuario"><span class="material-icons">person</span></a>
            <a href="{% url 'carrito_ver' %}" class="icon-btn cart-link" title="Carrito">
                <span class="material-icons">shopping_cart</span>
            </a>
        </div>

    </nav>

{% block content %}
{% endblock %}
</body>
<script>
    (function(){
        const navSearch = document.getElementById('navSearch');
        const btn = document.getElementById('searchToggle');
        const input = navSearch?.querySelector('input');
        const icon = btn?.querySelector('.material-icons');
        if(btn && navSearch){
            btn.addEventListener('click', function(){
                navSearch.classList.toggle('open');
                if(navSearch.classList.contains('open')){
                    if(icon){ icon.textContent = 'close'; btn.setAttribute('aria-label','Ocultar búsqueda'); }
                    if(input){ setTimeout(()=> input.focus(), 100); }
                } else {
                    if(icon){ icon.textContent = 'search'; btn.setAttribute('aria-label','Mostrar búsqueda'); }
                }
            });
        }
    })();
</script>
</html>
