{% extends "base.html" %}
{% load static %}

{% block title %}Más información{% endblock %}

{% block content %}
<style>
  .mi-wrap{
    min-height: calc(100dvh - 72px);
    display:grid;
    place-items:center;
    padding:16px;
    background:#000;
  }
  .mi-img{
    width:min(1200px, 96vw);
    height:auto;
    max-height: calc(100dvh - 140px);
    object-fit: contain;
    border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.12);
    border:1px solid var(--sbd-gray,#D9D9D9);
    background:#000;
    display:block;
  }
  .mi-empty{
    color:#fff; text-align:center; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  }
</style>

<main class="mi-wrap">
  {% if masinfo and masinfo.imagen %}
    <img class="mi-img"
         src="{{ masinfo.imagen.url }}?v={{ masinfo.actualizado|date:'U' }}"
         alt="{{ masinfo.titulo|default:'Más información' }}">
  {% else %}
    <div class="mi-empty">
      <h1>Más información</h1>
      <p>No hay imagen configurada por el administrador.</p>
    </div>
  {% endif %}
</main>
{% endblock %}
