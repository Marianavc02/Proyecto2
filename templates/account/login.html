{% load socialaccount %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Iniciando sesión…</title>
  <!-- Redirección inmediata al proveedor Microsoft -->
  <meta http-equiv="refresh" content="0;url={% provider_login_url 'microsoft' process='login' %}">
  <style>
    body{font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; padding: 24px;}
    .box{max-width:600px;margin:auto;text-align:center}
    .btn{display:inline-block;padding:10px 16px;border-radius:8px;background:#111;color:#fff;text-decoration:none}
  </style>
</head>
<body>
  <div class="box">
    <h1>Redirigiendo a Microsoft…</h1>
    <p>Si no eres redirigido automáticamente, haz clic en el botón:</p>
    <p><a class="btn" href="{% provider_login_url 'microsoft' process='login' %}">Continuar con Microsoft</a></p>
  </div>
  <script>
    // Refuerzo JS por si el meta no aplica
    window.location.replace("{% provider_login_url 'microsoft' process='login' %}");
  </script>
</body>
</html>
