{% extends "base.html" %}

{% block title %}Lista empleados{% endblock %}

{% block content %}
<div style="padding-top: 80px; font-family: 'Montserrat', sans-serif; background-color: #f9f9f9;">

    <h2 style="margin-bottom: 20px; font-weight: 600;">Lista de Empleados</h2>

    <!-- Botón Volver -->
    <button onclick="window.history.back()" 
        style="display:inline-flex;align-items:center;background-color:#e0e0e0;color:black;
               padding:10px 20px;margin-right:10px;border:none;border-radius:8px;
               font-weight:600;cursor:pointer;transition:background-color 0.3s ease;">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="black" viewBox="0 0 24 24">
            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
        </svg>
        &nbsp;Volver
    </button>

    <!-- Botón Importar -->
    <a href="{% url 'importar_empleados' %}" 
       style="display:inline-flex;align-items:center;background-color:#FFD20A;color:black;
              padding:10px 20px;text-decoration:none;border-radius:8px;font-weight:600;
              margin-bottom:20px;transition:background-color 0.3s ease;">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="black" viewBox="0 0 24 24">
            <path d="M5 20h14v-2H5v2zm7-18L5.33 9h3.84v4h6.66V9h3.84L12 2z"/>
        </svg>
        &nbsp;Importar
    </a>

    <!-- Tabla de empleados -->
    <table style="width:100%;border-collapse:collapse;background:white;border-radius:10px;
                  overflow:hidden;box-shadow:0 4px 8px rgba(0,0,0,0.1);">
        <thead>
            <tr>
                <th style="padding:12px 15px;border-bottom:1px solid #ddd;text-align:left;
                           background-color:#D9D9D9;font-weight:600;">ID</th>
                <th style="padding:12px 15px;border-bottom:1px solid #ddd;text-align:left;
                           background-color:#D9D9D9;font-weight:600;">Nombre Preferido</th>
                <th style="padding:12px 15px;border-bottom:1px solid #ddd;text-align:left;
                           background-color:#D9D9D9;font-weight:600;">Email</th>
            </tr>
        </thead>
        <tbody>
            {% for e in empleados %}
            <tr style="transition:background-color 0.3s ease;">
                <td style="padding:12px 15px;border-bottom:1px solid #ddd;">{{ e.id }}</td>
                <td style="padding:12px 15px;border-bottom:1px solid #ddd;">{{ e.preferred_name }}</td>
                <td style="padding:12px 15px;border-bottom:1px solid #ddd;">{{ e.sbd_email }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</div>
{% endblock %}
